name: CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_NAME: moskovmaxim/diploma-app

jobs:
  build:
    name: Сборка и публикация образа
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить метаданные сборки
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M') UTC" >> "$GITHUB_OUTPUT"

      - name: Настроить Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Собрать и отправить образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ github.run_number }}
            BUILD_COMMIT=${{ steps.meta.outputs.tag }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на виртуальную машину
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Скопировать compose-файл на сервер
        run: |
          scp -i ~/.ssh/id_ed25519 compose.yaml \
            ubuntu@${{ secrets.VM_HOST }}:/opt/diploma-app/compose.yaml

      - name: Развернуть новую версию
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.VM_HOST }} \
            "cd /opt/diploma-app && \
             APP_IMAGE=${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} \
             docker compose up -d --pull always --remove-orphans"

      - name: Проверить доступность приложения
        run: |
          sleep 5
          curl -fsS http://${{ secrets.VM_HOST }} | grep -q "${{ needs.build.outputs.image_tag }}"
          echo "Приложение отвечает, версия ${{ needs.build.outputs.image_tag }} развёрнута"
