<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps диплом — Максим Моськов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5f8a 100%);
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 48px;
      max-width: 640px;
      width: 100%;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .subtitle { opacity: 0.75; margin-bottom: 32px; font-size: 16px; }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .row:last-child { border-bottom: none; }
    .label { opacity: 0.7; }
    .value { font-family: monospace; font-weight: 600; }
    .badge {
      display: inline-block;
      background: #2ecc71;
      color: #123;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DEPLOY OK</div>
    <h1>DevOps диплом: Максим Моськов</h1>
    <p class="subtitle">Netology · Базовая DevOps-инфраструктура в Yandex.Cloud</p>

    <div class="row">
      <span class="label">Версия сборки</span>
      <span class="value">BUILD_VERSION</span>
    </div>
    <div class="row">
      <span class="label">Коммит</span>
      <span class="value">BUILD_COMMIT</span>
    </div>
    <div class="row">
      <span class="label">Собрано</span>
      <span class="value">BUILD_DATE</span>
    </div>
  </div>
</body>
</html>
